# Komplet applikationsdeploy — test → e2e (manuelt) → beta → prod i én kørsel.
# Brug dette til manuelle deploys. CI-pipelinen bruger deploy-test.yml og
# deploy-promote.yml separat med e2e-tests imellem.
#
# Brug:
#   ansible-playbook ansible/deploy.yml -i ansible/inventory.yml --ask-vault-pass

- import_playbook: deploy-test.yml
- import_playbook: deploy-promote.yml
