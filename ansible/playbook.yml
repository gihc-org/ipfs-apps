---
- name: Deploy chat backend
  hosts: gihc_vps

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl]
        state: present
        update_cache: true

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create project directory
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Sync project files
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ project_dir }}/"
        rsync_opts:
          - "--exclude=chat/target"
          - "--exclude=.git"
          - "--exclude=.env"
          - "--exclude=ansible"
          - "--exclude=docker-compose.override.yml"

    - name: Write Caddyfile with domain
      ansible.builtin.template:
        src: templates/Caddyfile.j2
        dest: "{{ project_dir }}/caddy/Caddyfile"
        mode: "0644"

    - name: Write .env from vault
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ project_dir }}/.env"
        mode: "0600"

    - name: Build and start services
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
        chdir: "{{ project_dir }}"
      register: compose_result
      changed_when: "'Started' in compose_result.stdout or 'Created' in compose_result.stdout"

    - name: Wait for IPFS to be ready
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml exec -T ipfs ipfs id
        chdir: "{{ project_dir }}"
      register: ipfs_ready
      retries: 10
      delay: 5
      until: ipfs_ready.rc == 0

    - name: Add frontend to IPFS
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml exec -T ipfs ipfs add -r /frontend/ -Q
        chdir: "{{ project_dir }}"
      register: ipfs_cid

    - name: Get DNS records from Simply.com
      ansible.builtin.uri:
        url: "https://api.simply.com/2/my/products/{{ domain }}/dns/records/"
        method: GET
        url_username: "{{ simply_account }}"
        url_password: "{{ simply_api_key }}"
        force_basic_auth: true
      register: simply_records

    - name: Find existing _dnslink record id
      ansible.builtin.set_fact:
        dnslink_record: >-
          {{ simply_records.json.records
             | selectattr('type', 'equalto', 'TXT')
             | selectattr('name', 'search', '_dnslink\.' + frontend_domain | replace('.' + domain, ''))
             | list | first | default({}) }}

    - name: Update _dnslink TXT record (existing)
      ansible.builtin.uri:
        url: "https://api.simply.com/2/my/products/{{ domain }}/dns/records/{{ dnslink_record.record_id }}/"
        method: PUT
        url_username: "{{ simply_account }}"
        url_password: "{{ simply_api_key }}"
        force_basic_auth: true
        body_format: json
        body:
          type: TXT
          name: "_dnslink.{{ frontend_domain }}"
          data: "dnslink=/ipfs/{{ ipfs_cid.stdout | trim }}"
          ttl: 120
        status_code: [200]
      when: dnslink_record.record_id is defined

    - name: Create _dnslink TXT record (new)
      ansible.builtin.uri:
        url: "https://api.simply.com/2/my/products/{{ domain }}/dns/records/"
        method: POST
        url_username: "{{ simply_account }}"
        url_password: "{{ simply_api_key }}"
        force_basic_auth: true
        body_format: json
        body:
          type: TXT
          name: "_dnslink.{{ frontend_domain }}"
          data: "dnslink=/ipfs/{{ ipfs_cid.stdout | trim }}"
          ttl: 120
        status_code: [200, 201]
      when: dnslink_record.record_id is not defined

    - name: Show IPFS CID
      ansible.builtin.debug:
        msg: "Frontend CID: {{ ipfs_cid.stdout | trim }} — _dnslink.{{ frontend_domain }} opdateret automatisk"
