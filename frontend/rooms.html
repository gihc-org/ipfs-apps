<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat — Rum</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main { max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h2 { margin-bottom: 20px; }
    .section-title {
      margin: 28px 0 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .room-list { display: flex; flex-direction: column; gap: 10px; }
    .room-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      cursor: pointer;
      transition: border-color 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .room-card:hover { border-color: var(--accent); }
    .room-name { font-weight: 600; }
    .new-room { display: flex; gap: 8px; margin-bottom: 24px; }
    .new-room input { flex: 1; }
    .new-room button { white-space: nowrap; }
    .empty { color: var(--text-muted); text-align: center; padding: 40px; }
    .search-box { margin-bottom: 12px; }
    .search-box input { width: 100%; box-sizing: border-box; }
    .user-list { display: flex; flex-direction: column; gap: 8px; }
    .user-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      cursor: pointer;
      transition: border-color 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-card:hover { border-color: var(--accent); }
    .dm-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 20px;
      cursor: pointer;
      transition: border-color 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dm-card:hover { border-color: var(--accent); }
    .dm-name { font-weight: 600; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">💬 Chat</span>
    <span class="user" id="navUser"></span>
    <button class="secondary" onclick="logout()" style="padding:6px 14px;font-size:13px">Log ud</button>
  </nav>

  <main>
    <h2 class="section-title">Direkte beskeder</h2>
    <div class="room-list" id="dmList"><div class="empty">Ingen direkte beskeder endnu.</div></div>

    <h2 class="section-title">Rum</h2>
    <div class="new-room">
      <input type="text" id="roomName" placeholder="Nyt rum...">
      <button onclick="createRoom()">Opret</button>
    </div>
    <div class="error" id="createError" style="margin-bottom:12px"></div>
    <div class="room-list" id="roomList"><div class="empty">Ingen rum endnu.</div></div>

    <h2 class="section-title">Brugere</h2>
    <div class="search-box">
      <input type="text" id="userSearch" placeholder="Søg efter brugernavn..." autocomplete="off">
    </div>
    <div class="user-list" id="userList"><div class="empty">Indtast for at søge efter brugere.</div></div>
  </main>

  <script src="config.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = 'index.html';

    async function api(path, opts = {}) {
      const res = await fetch(`${API_URL}${path}`, {
        ...opts,
        headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...opts.headers },
      });
      if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
      return res.json();
    }

    async function init() {
      const me = await api('/auth/me').catch(() => { localStorage.clear(); location.href = 'index.html'; });
      if (!me) return;
      localStorage.setItem('username', me.username);
      document.getElementById('navUser').textContent = me.username;
      await Promise.all([loadRooms(), loadDms()]);
      searchUsers('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadRooms() {
      const rooms = await api('/rooms');
      const list = document.getElementById('roomList');
      if (!rooms.length) { list.innerHTML = '<div class="empty">Ingen rum endnu.</div>'; return; }
      list.innerHTML = rooms.map(r => `
        <div class="room-card" onclick="enterRoom('${r.id}','${encodeURIComponent(r.name)}')">
          <span class="room-name"># ${escapeHtml(r.name)}</span>
          <span style="color:var(--text-muted);font-size:12px">→</span>
        </div>
      `).join('');
    }

    async function createRoom() {
      const name = document.getElementById('roomName').value.trim();
      const err = document.getElementById('createError');
      err.textContent = '';
      if (!name) return;
      try {
        await api('/rooms', { method: 'POST', body: JSON.stringify({ name }) });
        document.getElementById('roomName').value = '';
        await loadRooms();
      } catch (e) {
        err.textContent = e.message;
      }
    }

    document.getElementById('roomName').addEventListener('keydown', e => {
      if (e.key === 'Enter') createRoom();
    });

    document.getElementById('userSearch').addEventListener('input', e => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();
      searchTimeout = setTimeout(() => searchUsers(query), 300);
    });

    async function loadDms() {
      const dms = await api('/dms');
      const list = document.getElementById('dmList');
      if (!dms.length) { list.innerHTML = '<div class="empty">Ingen direkte beskeder endnu.</div>'; return; }
      list.innerHTML = dms.map(d => `
        <div class="dm-card" onclick="enterDm('${d.room_id}','${escapeHtml(d.other_username)}')">
          <span class="dm-name">@ ${escapeHtml(d.other_username)}</span>
          <span style="color:var(--text-muted);font-size:12px">→</span>
        </div>
      `).join('');
    }

    function enterDm(id, otherUsername) {
      location.href = `chat.html?room_id=${id}&room_name=${encodeURIComponent(otherUsername)}&is_dm=true`;
    }

    function enterRoom(id, name) {
      location.href = `chat.html?room_id=${id}&room_name=${name}`;
    }

    let searchTimeout;
    async function searchUsers(query) {
      const list = document.getElementById('userList');
      if (!query) {
        list.innerHTML = '<div class="empty">Indtast for at søge efter brugere.</div>';
        return;
      }
      try {
        const users = await api(`/users?search=${encodeURIComponent(query)}`);
        if (!users.length) { list.innerHTML = '<div class="empty">Ingen brugere fundet.</div>'; return; }
        list.innerHTML = users.map(u => `
          <div class="user-card" onclick="startDm('${u.id}','${escapeHtml(u.username)}')">
            <span>${escapeHtml(u.username)}</span>
            <button class="secondary" style="padding:4px 12px;font-size:12px">DM</button>
          </div>
        `).join('');
      } catch (_) {}
    }

    async function startDm(userId, username) {
      try {
        const dm = await api('/dms', { method: 'POST', body: JSON.stringify({ user_id: userId }) });
        enterDm(dm.room_id, username);
      } catch (e) {
        document.getElementById('createError').textContent = e.message;
      }
    }

    function logout() {
      localStorage.clear();
      location.href = 'index.html';
    }

    init();
  </script>
</body>
</html>
