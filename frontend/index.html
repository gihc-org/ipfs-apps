<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat — Log ind</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad" defer></script>
  <style>
    .container {
      max-width: 400px;
      margin: 80px auto;
      padding: 0 16px;
    }
    h1 { font-size: 24px; margin-bottom: 24px; text-align: center; }
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 8px 20px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    form { display: flex; flex-direction: column; gap: 12px; }
    button[type=submit] { margin-top: 4px; }
    button[type=submit]:disabled { opacity: 0.5; cursor: not-allowed; }
    #verifiedBanner {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💬 Chat</h1>
    <div id="verifiedBanner">✅ Email bekræftet! Du kan nu logge ind.</div>
    <div class="card">
      <div class="tabs">
        <div class="tab active" data-tab="login">Log ind</div>
        <div class="tab" data-tab="register">Opret konto</div>
      </div>

      <form id="loginForm">
        <input type="text" id="loginUsername" placeholder="Brugernavn" required>
        <input type="password" id="loginPassword" placeholder="Adgangskode" required>
        <button type="submit">Log ind</button>
        <div class="error" id="loginError"></div>
      </form>

      <form id="registerForm" style="display:none">
        <input type="text" id="regUsername" placeholder="Brugernavn" required>
        <input type="email" id="regEmail" placeholder="Email" required>
        <input type="password" id="regPassword" placeholder="Adgangskode" required>
        <div id="turnstile-container"></div>
        <button type="submit" id="regSubmit" disabled>Opret konto</button>
        <div class="error" id="regError"></div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    if (localStorage.getItem('token')) location.href = 'rooms.html';

    if (new URLSearchParams(location.search).get('verified') === 'true') {
      document.getElementById('verifiedBanner').style.display = 'block';
      history.replaceState({}, '', location.pathname);
    }

    let turnstileWidget = null;

    function renderTurnstile() {
      if (turnstileWidget !== null) return;
      turnstileWidget = turnstile.render('#turnstile-container', {
        sitekey: TURNSTILE_SITE_KEY,
        theme: 'light',
        callback: () => {
          document.getElementById('regSubmit').disabled = false;
        },
        'expired-callback': () => {
          document.getElementById('regSubmit').disabled = true;
        },
        'error-callback': () => {
          document.getElementById('regSubmit').disabled = true;
        },
      });
    }

    // Called by Turnstile script when it finishes loading
    function onTurnstileLoad() {
      if (document.getElementById('registerForm').style.display !== 'none') {
        renderTurnstile();
      }
    }

    function showTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-tab="${name}"]`).classList.add('active');
      document.getElementById('loginForm').style.display = name === 'login' ? '' : 'none';
      document.getElementById('registerForm').style.display = name === 'register' ? '' : 'none';

      if (name === 'register' && typeof turnstile !== 'undefined') {
        renderTurnstile();
      }
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => showTab(tab.dataset.tab));
    });

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      errEl.textContent = '';
      errEl.style.color = '';
      try {
        const res = await fetch(`${API_URL}/auth/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('loginUsername').value,
            password: document.getElementById('loginPassword').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);
        localStorage.setItem('token', data.access_token);
        location.href = 'rooms.html';
      } catch (e) {
        errEl.textContent = e.message;
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl = document.getElementById('regError');
      errEl.textContent = '';
      errEl.style.color = '';

      const turnstileToken = turnstileWidget !== null ? turnstile.getResponse(turnstileWidget) : '';

      try {
        const res = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('regUsername').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            turnstile_token: turnstileToken,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);
        errEl.style.color = 'var(--accent)';
        errEl.textContent = data.message;
        turnstile.reset(turnstileWidget);
        document.getElementById('regSubmit').disabled = true;
      } catch (e) {
        errEl.textContent = e.message;
        turnstile.reset(turnstileWidget);
        document.getElementById('regSubmit').disabled = true;
      }
    });
  </script>
</body>
</html>
