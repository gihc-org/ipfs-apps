<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; overflow: hidden; }
    .chat-layout { display: flex; flex-direction: column; height: 100vh; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg { max-width: 680px; width: 100%; margin: 0 auto; }
    .msg .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
    .msg .meta .author { font-weight: 700; color: var(--accent); }
    .msg.own .meta .author { color: var(--text); }
    .msg .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg.own .bubble { background: var(--surface2); }
    .system-msg {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      max-width: 100%;
    }
    .input-bar input { flex: 1; }
    #status { font-size: 12px; color: var(--text-muted); padding: 4px 20px; background: var(--surface); }
    #shareBtn {
      padding: 6px 14px;
      font-size: 13px;
      display: none;
    }
    #shareBtn.active { background: var(--danger); }
    #screenSharePanel {
      display: none;
      background: #000;
      position: relative;
      max-height: 40vh;
      overflow: hidden;
    }
    #remoteVideo {
      width: 100%;
      max-height: 40vh;
      object-fit: contain;
      display: block;
    }
    #screenShareBanner {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
    }
    #closePeerVideo {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="chat-layout">
    <nav>
      <a href="rooms.html" class="brand" style="text-decoration:none">← Rum</a>
      <span id="roomTitle" style="font-weight:700"></span>
      <span style="display:flex;align-items:center;gap:12px">
        <span class="user" id="navUser"></span>
        <button id="shareBtn" onclick="toggleScreenShare()">Del skærm</button>
      </span>
    </nav>

    <div id="screenSharePanel">
      <video id="remoteVideo" autoplay playsinline></video>
      <span id="screenShareBanner">Deler skærm</span>
      <button id="closePeerVideo" onclick="closePeerVideo()">✕</button>
    </div>

    <div id="status">Forbinder...</div>
    <div class="messages" id="messages"></div>

    <div class="input-bar">
      <input type="text" id="msgInput" placeholder="Skriv en besked..." autocomplete="off">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const username = localStorage.getItem('username');
    const myUserId = localStorage.getItem('userId');
    if (!token) { location.href = 'index.html'; }

    const params = new URLSearchParams(location.search);
    const roomId = params.get('room_id');
    const roomName = decodeURIComponent(params.get('room_name') || 'Rum');
    const isDm = params.get('is_dm') === 'true';
    const peerId = params.get('peer_id');
    if (!roomId) { location.href = 'rooms.html'; }

    const prefix = isDm ? '@ ' : '# ';
    document.getElementById('roomTitle').textContent = prefix + roomName;
    document.getElementById('navUser').textContent = username || '';
    document.title = `${isDm ? '@' : '#'}${roomName} — Chat`;

    if (isDm && peerId) document.getElementById('shareBtn').style.display = 'inline-block';

    const messagesEl = document.getElementById('messages');
    const statusEl = document.getElementById('status');
    let ws;

    // ── WebRTC ────────────────────────────────────────────────────────────────
    const ICE_SERVERS = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' },
    ];

    let pc = null;
    let localStream = null;
    let sharing = false;

    function sendSignal(signal) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'signal', target: peerId, signal }));
    }

    function createPeerConnection() {
      if (pc) pc.close();
      pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

      pc.onicecandidate = e => {
        if (e.candidate) sendSignal({ type: 'ice-candidate', candidate: e.candidate });
      };

      pc.ontrack = e => {
        const panel = document.getElementById('screenSharePanel');
        const video = document.getElementById('remoteVideo');
        const banner = document.getElementById('screenShareBanner');
        video.srcObject = e.streams[0];
        banner.textContent = `${roomName} deler skærm`;
        panel.style.display = 'block';
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') {
          closePeerVideo();
        }
      };

      return pc;
    }

    async function toggleScreenShare() {
      if (sharing) {
        stopScreenShare();
      } else {
        await startScreenShare();
      }
    }

    async function startScreenShare() {
      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      } catch {
        return;
      }

      sharing = true;
      const btn = document.getElementById('shareBtn');
      btn.textContent = 'Stop deling';
      btn.classList.add('active');

      createPeerConnection();
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

      // Stop sharing if user closes the browser's native share dialog
      localStream.getVideoTracks()[0].onended = () => stopScreenShare();

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      sendSignal({ type: 'offer', sdp: pc.localDescription });
      sendSignal({ type: 'started' });
    }

    function stopScreenShare() {
      if (!sharing) return;
      sharing = false;
      localStream?.getTracks().forEach(t => t.stop());
      localStream = null;
      pc?.close();
      pc = null;

      const btn = document.getElementById('shareBtn');
      btn.textContent = 'Del skærm';
      btn.classList.remove('active');

      sendSignal({ type: 'stopped' });
      closePeerVideo();
    }

    function closePeerVideo() {
      const panel = document.getElementById('screenSharePanel');
      const video = document.getElementById('remoteVideo');
      video.srcObject = null;
      panel.style.display = 'none';
    }

    async function reinitiateOffer() {
      if (!sharing || !localStream) return;
      if (pc && ['connected', 'connecting'].includes(pc.connectionState)) return;
      createPeerConnection();
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      sendSignal({ type: 'offer', sdp: pc.localDescription });
    }

    async function handleSignal(from, signal) {
      if (from !== peerId) return;

      if (signal.type === 'offer') {
        createPeerConnection();
        await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendSignal({ type: 'answer', sdp: pc.localDescription });

      } else if (signal.type === 'answer') {
        await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));

      } else if (signal.type === 'ice-candidate') {
        await pc.addIceCandidate(new RTCIceCandidate(signal.candidate)).catch(() => {});

      } else if (signal.type === 'stopped') {
        closePeerVideo();
        pc?.close();
        pc = null;
      }
    }

    // ── Chat ──────────────────────────────────────────────────────────────────
    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendMessage({ type, user, content, created_at }) {
      if (type === 'join' || type === 'leave') {
        const div = document.createElement('div');
        div.className = 'system-msg';
        div.textContent = type === 'join' ? `${user} kom ind i rummet` : `${user} forlod rummet`;
        messagesEl.appendChild(div);
      } else if (type === 'message') {
        const div = document.createElement('div');
        div.className = 'msg' + (user === username ? ' own' : '');
        const time = created_at ? new Date(created_at).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' }) : '';
        div.innerHTML = `
          <div class="meta"><span class="author">${escapeHtml(user)}</span> ${escapeHtml(time)}</div>
          <div class="bubble">${escapeHtml(content)}</div>
        `;
        messagesEl.appendChild(div);
      }
      scrollBottom();
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadHistory() {
      try {
        const res = await fetch(`${API_URL}/rooms/${roomId}/messages`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) return;
        const msgs = await res.json();
        msgs.forEach(m => appendMessage({ type: 'message', user: m.user, content: m.content, created_at: m.created_at }));
      } catch (_) {}
    }

    function connect() {
      ws = new WebSocket(`${WS_URL}/ws/${roomId}?token=${token}`);

      ws.onopen = () => {
        statusEl.textContent = 'Forbundet';
        setTimeout(() => { statusEl.textContent = ''; }, 2000);
      };

      ws.onmessage = e => {
        const data = JSON.parse(e.data);
        if (data.type === 'signal') {
          handleSignal(data.from, data.signal);
        } else {
          if (data.type === 'join' && isDm && sharing && data.user === roomName) {
            setTimeout(reinitiateOffer, 500);
          }
          appendMessage(data);
        }
      };

      ws.onclose = () => {
        stopScreenShare();
        statusEl.textContent = 'Forbindelsen mistet — forsøger igen...';
        setTimeout(connect, 3000);
      };

      ws.onerror = () => ws.close();
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const content = input.value.trim();
      if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ content }));
      input.value = '';
    }

    document.getElementById('msgInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    (async () => {
      await loadHistory();
      connect();
    })();
  </script>
</body>
</html>
