<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; overflow: hidden; }
    .chat-layout { display: flex; flex-direction: column; height: 100vh; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg { max-width: 680px; width: 100%; margin: 0 auto; }
    .msg .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
    .msg .meta .author { font-weight: 700; color: var(--accent); }
    .msg.own .meta .author { color: var(--text); }
    .msg .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg.own .bubble { background: var(--surface2); }
    .system-msg {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      max-width: 100%;
    }
    .input-bar input { flex: 1; }
    #status { font-size: 12px; color: var(--text-muted); padding: 4px 20px; background: var(--surface); }

    /* ── Skærmdeling ── */
    #shareBtn { padding: 6px 14px; font-size: 13px; display: none; }
    #shareBtn.active { background: var(--danger); }
    #screenSharePanel {
      display: none;
      background: #000;
      position: relative;
      max-height: 40vh;
      overflow: hidden;
    }
    #remoteVideo { width: 100%; max-height: 40vh; object-fit: contain; display: block; }
    #screenShareBanner {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,0.6); color: #fff;
      font-size: 12px; padding: 4px 10px; border-radius: 4px;
    }
    #closePeerVideo {
      position: absolute; top: 8px; right: 8px;
      background: rgba(0,0,0,0.6); color: #fff;
      border: none; border-radius: 4px; padding: 4px 10px;
      font-size: 12px; cursor: pointer;
    }

    /* ── Opkald ── */
    #callBtn { padding: 6px 14px; font-size: 13px; display: none; }
    #callBtn.active { background: var(--danger); }

    #incomingCall {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #incomingCall.visible { display: flex; }
    #incomingCallBox {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    #incomingCallBox p { font-size: 18px; font-weight: 600; margin: 0; }
    #incomingCallBox .call-actions { display: flex; gap: 12px; justify-content: center; }

    #activeCall {
      display: none;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      align-items: center;
      gap: 16px;
      font-size: 13px;
    }
    #activeCall.visible { display: flex; }
    #callDuration { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
    #activeCall .spacer { flex: 1; }
    #muteBtn.muted { background: var(--danger); }

    /* ── Filoverførsel ── */
    #attachBtn { padding: 6px 10px; font-size: 16px; display: none; }
    .file-transfer {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      font-size: 13px;
      color: var(--text-muted);
      padding: 4px 0;
    }
    .file-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      text-decoration: none;
      color: var(--accent);
      cursor: pointer;
    }
    .file-link:hover { background: var(--surface2); }
  </style>
</head>
<body>
  <div class="chat-layout">
    <nav>
      <a href="rooms.html" class="brand" style="text-decoration:none">← Rum</a>
      <span id="roomTitle" style="font-weight:700"></span>
      <span style="display:flex;align-items:center;gap:12px">
        <span class="user" id="navUser"></span>
        <button id="callBtn" onclick="startCall()">Ring op</button>
        <button id="shareBtn" onclick="toggleScreenShare()">Del skærm</button>
      </span>
    </nav>

    <div id="activeCall">
      <span id="callDuration">00:00</span>
      <span>Opkald med <strong id="callWith"></strong></span>
      <span class="spacer"></span>
      <button id="muteBtn" onclick="toggleMute()" style="padding:4px 12px;font-size:12px">Dæmp</button>
      <button onclick="hangUp()" style="padding:4px 12px;font-size:12px;background:var(--danger)">Læg på</button>
    </div>

    <div id="screenSharePanel">
      <video id="remoteVideo" autoplay playsinline></video>
      <span id="screenShareBanner">Deler skærm</span>
      <button id="closePeerVideo" onclick="closePeerVideo(true)">✕</button>
    </div>

    <div id="status">Forbinder...</div>
    <div class="messages" id="messages"></div>

    <div class="input-bar">
      <input type="text" id="msgInput" placeholder="Skriv en besked..." autocomplete="off">
      <button id="attachBtn" onclick="document.getElementById('fileInput').click()" title="Vedhæft fil">📎</button>
      <button onclick="sendMessage()">Send</button>
    </div>
    <input type="file" id="fileInput" style="display:none">
  </div>

  <!-- Indgående opkald overlay -->
  <div id="incomingCall">
    <div id="incomingCallBox">
      <p id="callerLabel">Indgående opkald</p>
      <div class="call-actions">
        <button onclick="acceptCall()" style="background:var(--accent)">Accepter</button>
        <button onclick="rejectCall()" style="background:var(--danger)">Afvis</button>
      </div>
    </div>
  </div>

  <!-- Skjult audio-element til fjernlyden -->
  <audio id="remoteAudio" autoplay></audio>

  <script src="config.js"></script>
  <script src="version-check.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const username = localStorage.getItem('username');
    const myUserId = localStorage.getItem('userId');
    if (!token) { location.href = 'index.html'; }

    const params = new URLSearchParams(location.search);
    const roomId = params.get('room_id');
    const roomName = decodeURIComponent(params.get('room_name') || 'Rum');
    const isDm = params.get('is_dm') === 'true';
    const peerId = params.get('peer_id');
    if (!roomId) { location.href = 'rooms.html'; }

    const prefix = isDm ? '@ ' : '# ';
    document.getElementById('roomTitle').textContent = prefix + roomName;
    document.getElementById('navUser').textContent = username || '';
    document.title = `${isDm ? '@' : '#'}${roomName} — Chat`;

    if (isDm && peerId) {
      document.getElementById('shareBtn').style.display = 'inline-block';
      document.getElementById('callBtn').style.display = 'inline-block';
      document.getElementById('attachBtn').style.display = 'inline-block';
    }

    const messagesEl = document.getElementById('messages');
    const statusEl = document.getElementById('status');
    let ws;

    // ── WebRTC fælles ──────────────────────────────────────────────────────────
    const ICE_SERVERS = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' },
    ];

    async function addTurnServer() {
      if (typeof TURN_URL === 'undefined' || typeof TURN_SECRET === 'undefined') return;
      const expires = Math.floor(Date.now() / 1000) + 86400;
      const username = String(expires);
      const key = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(TURN_SECRET),
        { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']
      );
      const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(username));
      const credential = btoa(String.fromCharCode(...new Uint8Array(sig)));
      ICE_SERVERS.push({ urls: TURN_URL, username, credential });
    }

    let pc = null;
    let localStream = null;   // skærmdeling-stream
    let callStream = null;    // lyd-stream
    let sharing = false;
    let inCall = false;
    let muted = false;
    let lastOfferTime = 0;
    let callTimeout = null;
    let callDurationInterval = null;
    let ringtoneCtx = null;
    let ringtoneInterval = null;
    let pendingOffer = false; // guard: true while explicit createOffer() is in progress
    let peerOnline = false;
    const pendingFiles = {};  // channelId → {filename, size, mime} for incoming DataChannel files

    function sendSignal(signal) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'signal', target: peerId, signal }));
    }

    function getOrCreatePeerConnection() {
      if (pc && pc.connectionState !== 'closed' && pc.connectionState !== 'failed') return pc;
      return createPeerConnection();
    }

    function createPeerConnection() {
      if (pc) pc.close();
      pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

      pc.onicecandidate = e => {
        if (e.candidate) sendSignal({ type: 'ice-candidate', candidate: e.candidate });
      };

      // Handles renegotiation triggered by createDataChannel() when SCTP not yet set up.
      // Skipped when explicit offer creation is already in progress (pendingOffer flag).
      pc.onnegotiationneeded = async () => {
        if (pendingOffer || pc.signalingState !== 'stable') return;
        if (Date.now() - lastOfferTime < 3000) return;
        try {
          pendingOffer = true;
          const offer = await pc.createOffer();
          if (pc.signalingState !== 'stable') return;
          await pc.setLocalDescription(offer);
          lastOfferTime = Date.now();
          sendSignal({ type: 'offer', sdp: pc.localDescription });
        } finally {
          pendingOffer = false;
        }
      };

      pc.ondatachannel = e => {
        if (!e.channel.label.startsWith('file-')) return;
        const channelId = e.channel.label.slice(5);
        const info = pendingFiles[channelId];
        if (!info) return;
        delete pendingFiles[channelId];
        receiveFile(e.channel, info);
      };

      pc.ontrack = e => {
        if (e.track.kind === 'audio') {
          const audio = document.getElementById('remoteAudio');
          if (e.streams[0]) {
            audio.srcObject = e.streams[0];
          } else {
            if (!audio.srcObject) audio.srcObject = new MediaStream();
            audio.srcObject.addTrack(e.track);
          }
          audio.play().catch(() => {});
        } else {
          const panel = document.getElementById('screenSharePanel');
          const video = document.getElementById('remoteVideo');
          video.srcObject = e.streams[0];
          document.getElementById('screenShareBanner').textContent = `${roomName} deler skærm`;
          panel.style.display = 'block';
        }
      };

      pc.onconnectionstatechange = () => {
        const state = pc.connectionState;
        if (state === 'disconnected' || state === 'failed') {
          closePeerVideo();
          if (inCall) hangUp();
          if (sharing) {
            const thisPc = pc;
            // failed: permanent — retry after 2s; disconnected: transient — give browser 10s to self-recover first
            const delay = state === 'failed' ? 2000 : 10000;
            setTimeout(() => {
              if (pc === thisPc && sharing && pc.connectionState !== 'connected') {
                reinitiateOffer();
              }
            }, delay);
          }
        }
      };

      return pc;
    }

    // ── Skærmdeling ───────────────────────────────────────────────────────────
    async function toggleScreenShare() {
      sharing ? stopScreenShare() : await startScreenShare();
    }

    async function startScreenShare() {
      try {
        localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      } catch {
        return;
      }

      sharing = true;
      const btn = document.getElementById('shareBtn');
      btn.textContent = 'Stop deling';
      btn.classList.add('active');

      pendingOffer = true;
      getOrCreatePeerConnection();
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      localStream.getVideoTracks()[0].onended = () => stopScreenShare();

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        lastOfferTime = Date.now();
        sendSignal({ type: 'offer', sdp: pc.localDescription });
        sendSignal({ type: 'started' });
      } finally {
        pendingOffer = false;
      }
    }

    function stopScreenShare() {
      if (!sharing) return;
      sharing = false;

      localStream?.getTracks().forEach(t => {
        t.stop();
        if (inCall && pc) {
          const sender = pc.getSenders().find(s => s.track === t);
          if (sender) pc.removeTrack(sender);
        }
      });
      localStream = null;

      const btn = document.getElementById('shareBtn');
      btn.textContent = 'Del skærm';
      btn.classList.remove('active');

      sendSignal({ type: 'stopped' });
      closePeerVideo();

      if (!inCall) { pc?.close(); pc = null; }
    }

    function closePeerVideo(notify = false) {
      if (notify) sendSignal({ type: 'close' });
      document.getElementById('screenSharePanel').style.display = 'none';
      document.getElementById('remoteVideo').srcObject = null;
    }

    async function reinitiateOffer() {
      if (!sharing || !localStream) return;
      if (pc && pc.connectionState === 'connecting') return;
      if (Date.now() - lastOfferTime < 3000) return;

      pendingOffer = true;
      createPeerConnection();
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      if (inCall && callStream) callStream.getTracks().forEach(t => pc.addTrack(t, callStream));

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        lastOfferTime = Date.now();
        sendSignal({ type: 'offer', sdp: pc.localDescription });
      } finally {
        pendingOffer = false;
      }
    }

    // ── Opkald ────────────────────────────────────────────────────────────────
    function startRingtone() {
      ringtoneCtx = new AudioContext();
      let beat = 0;
      ringtoneInterval = setInterval(() => {
        const osc = ringtoneCtx.createOscillator();
        const gain = ringtoneCtx.createGain();
        osc.connect(gain);
        gain.connect(ringtoneCtx.destination);
        osc.frequency.value = beat % 2 === 0 ? 480 : 440;
        gain.gain.setValueAtTime(0.25, ringtoneCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ringtoneCtx.currentTime + 0.4);
        osc.start(ringtoneCtx.currentTime);
        osc.stop(ringtoneCtx.currentTime + 0.4);
        beat++;
      }, 700);
    }

    function stopRingtone() {
      clearInterval(ringtoneInterval);
      ringtoneInterval = null;
      ringtoneCtx?.close();
      ringtoneCtx = null;
    }

    function startCallTimer() {
      const start = Date.now();
      const el = document.getElementById('callDuration');
      callDurationInterval = setInterval(() => {
        const s = Math.floor((Date.now() - start) / 1000);
        const mm = String(Math.floor(s / 60)).padStart(2, '0');
        const ss = String(s % 60).padStart(2, '0');
        el.textContent = `${mm}:${ss}`;
      }, 1000);
    }

    function showActiveCall() {
      document.getElementById('callWith').textContent = roomName;
      document.getElementById('activeCall').classList.add('visible');
      startCallTimer();
    }

    function hideActiveCall() {
      document.getElementById('activeCall').classList.remove('visible');
      document.getElementById('callDuration').textContent = '00:00';
      clearInterval(callDurationInterval);
      callDurationInterval = null;
    }

    // Caller: send invite
    function startCall() {
      if (inCall) return;
      sendSignal({ type: 'call-invite' });
      document.getElementById('callBtn').textContent = 'Afbryd...';
      document.getElementById('callBtn').classList.add('active');
      callTimeout = setTimeout(() => {
        sendSignal({ type: 'call-end' });
        resetCallBtn();
        appendSystemMsg('Intet svar');
      }, 30000);
    }

    // Caller: received call-accept — now start WebRTC
    async function startCallAfterAccept() {
      clearTimeout(callTimeout);
      callTimeout = null;
      resetCallBtn();

      try {
        callStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch {
        sendSignal({ type: 'call-end' });
        return;
      }

      inCall = true;
      pendingOffer = true;
      getOrCreatePeerConnection();
      callStream.getTracks().forEach(t => pc.addTrack(t, callStream));
      showActiveCall();

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        lastOfferTime = Date.now();
        sendSignal({ type: 'offer', sdp: pc.localDescription });
      } finally {
        pendingOffer = false;
      }
    }

    // Callee: show incoming overlay
    function showIncomingCall() {
      document.getElementById('callerLabel').textContent = `${roomName} ringer op`;
      document.getElementById('incomingCall').classList.add('visible');
      startRingtone();
      callTimeout = setTimeout(() => {
        rejectCall();
        appendSystemMsg('Mistet opkald fra ' + roomName);
      }, 30000);
    }

    // Callee: accept
    async function acceptCall() {
      clearTimeout(callTimeout);
      callTimeout = null;
      stopRingtone();
      document.getElementById('incomingCall').classList.remove('visible');

      try {
        callStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch {
        sendSignal({ type: 'call-reject' });
        return;
      }

      inCall = true;
      showActiveCall();
      sendSignal({ type: 'call-accept' });
      // Caller will now send an offer; callee's audio track is added in handleSignal
    }

    // Callee: reject
    function rejectCall() {
      clearTimeout(callTimeout);
      callTimeout = null;
      stopRingtone();
      document.getElementById('incomingCall').classList.remove('visible');
      sendSignal({ type: 'call-reject' });
    }

    function hangUp() {
      if (!inCall) return;
      inCall = false;
      muted = false;

      callStream?.getTracks().forEach(t => {
        t.stop();
        if (sharing && pc) {
          const sender = pc.getSenders().find(s => s.track === t);
          if (sender) pc.removeTrack(sender);
        }
      });
      callStream = null;

      const remoteAudio = document.getElementById('remoteAudio');
      remoteAudio.srcObject = null;

      sendSignal({ type: 'call-end' });
      hideActiveCall();
      resetCallBtn();

      if (!sharing) { pc?.close(); pc = null; }
    }

    function toggleMute() {
      if (!callStream) return;
      muted = !muted;
      callStream.getAudioTracks().forEach(t => { t.enabled = !muted; });
      const btn = document.getElementById('muteBtn');
      btn.textContent = muted ? 'Slå lyd til' : 'Dæmp';
      btn.classList.toggle('muted', muted);
    }

    function resetCallBtn() {
      const btn = document.getElementById('callBtn');
      btn.textContent = 'Ring op';
      btn.classList.remove('active');
    }

    function appendSystemMsg(text) {
      const div = document.createElement('div');
      div.className = 'system-msg';
      div.textContent = text;
      messagesEl.appendChild(div);
      scrollBottom();
    }

    // ── Signal-håndtering ─────────────────────────────────────────────────────
    async function handleSignal(from, signal) {
      if (from !== peerId) return;

      if (signal.type === 'offer') {
        // Renegotiering hvis PC allerede er forbundet (fx tilføjelse af lyd-track)
        const renegotiate = pc && pc.connectionState === 'connected';
        if (!renegotiate) createPeerConnection();

        // Hvis vi er i et opkald: tilføj vores lyd-track hvis det ikke allerede er der
        if (inCall && callStream) {
          const hasAudio = pc.getSenders().some(s => s.track?.kind === 'audio');
          if (!hasAudio) callStream.getTracks().forEach(t => pc.addTrack(t, callStream));
        }

        await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendSignal({ type: 'answer', sdp: pc.localDescription });

      } else if (signal.type === 'answer') {
        await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));

      } else if (signal.type === 'ice-candidate') {
        await pc.addIceCandidate(new RTCIceCandidate(signal.candidate)).catch(() => {});

      } else if (signal.type === 'stopped') {
        closePeerVideo();
        if (!inCall) { pc?.close(); pc = null; }

      } else if (signal.type === 'close') {
        stopScreenShare();

      } else if (signal.type === 'call-invite') {
        if (!inCall) showIncomingCall();

      } else if (signal.type === 'call-accept') {
        await startCallAfterAccept();

      } else if (signal.type === 'call-reject') {
        clearTimeout(callTimeout);
        callTimeout = null;
        resetCallBtn();
        appendSystemMsg(roomName + ' afviste opkaldet');

      } else if (signal.type === 'call-end') {
        stopRingtone();
        document.getElementById('incomingCall').classList.remove('visible');
        inCall = false;
        muted = false;
        callStream?.getTracks().forEach(t => t.stop());
        callStream = null;
        document.getElementById('remoteAudio').srcObject = null;
        hideActiveCall();
        resetCallBtn();
        if (!sharing) { pc?.close(); pc = null; }

      } else if (signal.type === 'file-offer') {
        pendingFiles[signal.channelId] = { filename: signal.filename, size: signal.size, mime: signal.mime };
        // Ensure PC exists so ondatachannel handler is ready when the offer arrives
        getOrCreatePeerConnection();
      }
    }

    // ── Chat ──────────────────────────────────────────────────────────────────
    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendMessage({ type, user, content, created_at }) {
      if (type === 'join' || type === 'leave') {
        appendSystemMsg(type === 'join' ? `${user} kom ind i rummet` : `${user} forlod rummet`);
      } else if (type === 'message') {
        const div = document.createElement('div');
        div.className = 'msg' + (user === username ? ' own' : '');
        const time = created_at ? new Date(created_at).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' }) : '';

        const meta = document.createElement('div');
        meta.className = 'meta';
        const authorEl = document.createElement('span');
        authorEl.className = 'author';
        authorEl.textContent = user;
        meta.appendChild(authorEl);
        meta.appendChild(document.createTextNode(' ' + time));

        const bubble = document.createElement('div');
        bubble.className = 'bubble';

        if (content.startsWith('__file__:')) {
          try {
            const info = JSON.parse(content.slice(9));
            const btn = document.createElement('button');
            btn.className = 'file-link';
            btn.textContent = `📎 ${info.filename} (${formatSize(info.size)})`;
            btn.onclick = () => downloadFile(info.id, info.filename);
            bubble.appendChild(btn);
          } catch {
            bubble.textContent = content;
          }
        } else {
          bubble.textContent = content;
        }

        div.appendChild(meta);
        div.appendChild(bubble);
        messagesEl.appendChild(div);
        scrollBottom();
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadHistory() {
      try {
        const res = await fetch(`${API_URL}/rooms/${roomId}/messages`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) return;
        const msgs = await res.json();
        msgs.forEach(m => appendMessage({ type: 'message', user: m.user, content: m.content, created_at: m.created_at }));
      } catch (_) {}
    }

    // ── Filoverførsel ─────────────────────────────────────────────────────────
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function appendFileProgress(filename, size, label) {
      const div = document.createElement('div');
      div.className = 'file-transfer';
      const nameSpan = document.createElement('span');
      nameSpan.textContent = `📎 ${filename} (${formatSize(size)}) — `;
      const statusSpan = document.createElement('span');
      statusSpan.className = 'file-status';
      statusSpan.textContent = label;
      div.appendChild(nameSpan);
      div.appendChild(statusSpan);
      messagesEl.appendChild(div);
      scrollBottom();
      return div;
    }

    function updateProgress(el, fraction) {
      const status = el.querySelector('.file-status');
      if (status) status.textContent = Math.round(fraction * 100) + '%';
    }

    function showFileDownload(el, filename, size, url) {
      el.textContent = '';
      const btn = document.createElement('button');
      btn.className = 'file-link';
      btn.textContent = `📎 ${filename} (${formatSize(size)})`;
      btn.onclick = () => {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
      };
      el.appendChild(btn);
      scrollBottom();
    }

    async function downloadFile(id, filename) {
      try {
        const res = await fetch(`${API_URL}/files/${id}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) throw new Error();
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      } catch {
        alert('Kunne ikke hente filen. Prøv igen.');
      }
    }

    function receiveFile(dc, info) {
      dc.binaryType = 'arraybuffer';
      const chunks = [];
      let received = 0;
      const progressEl = appendFileProgress(info.filename, info.size, 'Modtager...');

      dc.onmessage = e => {
        if (typeof e.data !== 'object') return;
        chunks.push(e.data);
        received += e.data.byteLength;
        updateProgress(progressEl, received / info.size);
        if (received >= info.size) {
          const blob = new Blob(chunks, { type: info.mime });
          const url = URL.createObjectURL(blob);
          showFileDownload(progressEl, info.filename, info.size, url);
        }
      };
      dc.onerror = () => {
        const s = progressEl.querySelector('.file-status');
        if (s) s.textContent = 'Overførsel fejlede';
      };
    }

    async function sendFileP2P(file) {
      const channelId = crypto.randomUUID();
      sendSignal({ type: 'file-offer', filename: file.name, size: file.size, mime: file.type, channelId });

      getOrCreatePeerConnection();
      const dc = pc.createDataChannel('file-' + channelId);
      dc.binaryType = 'arraybuffer';

      const progressEl = appendFileProgress(file.name, file.size, 'Venter på forbindelse...');

      // Fallback: if DataChannel doesn't open within 10s (peer not on this DM page),
      // cancel and upload via backend instead.
      const fallbackTimer = setTimeout(() => {
        if (dc.readyState !== 'open') {
          dc.close();
          progressEl.remove();
          sendFileBackend(file);
        }
      }, 10000);

      dc.onopen = async () => {
        clearTimeout(fallbackTimer);
        progressEl.querySelector('.file-status').textContent = 'Sender...';
        const CHUNK = 16384;
        const buf = await file.arrayBuffer();
        let sent = 0;
        while (sent < buf.byteLength) {
          while (dc.bufferedAmount > 1024 * 1024) {
            await new Promise(r => setTimeout(r, 10));
          }
          dc.send(buf.slice(sent, Math.min(sent + CHUNK, buf.byteLength)));
          sent = Math.min(sent + CHUNK, buf.byteLength);
          updateProgress(progressEl, sent / buf.byteLength);
        }
        const s = progressEl.querySelector('.file-status');
        if (s) s.textContent = '✓ Sendt';
      };
      dc.onerror = () => {
        clearTimeout(fallbackTimer);
        const s = progressEl.querySelector('.file-status');
        if (s) s.textContent = 'Fejl ved sending';
      };
    }

    async function sendFileBackend(file) {
      const progressEl = appendFileProgress(file.name, file.size, 'Uploader...');
      const fd = new FormData();
      fd.append('room_id', roomId);
      fd.append('file', file);
      try {
        const res = await fetch(`${API_URL}/files`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body: fd,
        });
        if (!res.ok) throw new Error();
        const { id } = await res.json();
        progressEl.remove();
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            content: '__file__:' + JSON.stringify({ id, filename: file.name, size: file.size, mime: file.type }),
          }));
        }
      } catch {
        const s = progressEl.querySelector('.file-status');
        if (s) s.textContent = 'Upload fejlede';
      }
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      if (peerOnline) {
        sendFileP2P(file);
      } else {
        sendFileBackend(file);
      }
    }

    document.getElementById('fileInput').addEventListener('change', handleFileSelect);

    async function checkPeerPresence() {
      if (!isDm || !peerId) return;
      try {
        const res = await fetch(`${API_URL}/presence`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) return;
        const { online } = await res.json();
        peerOnline = online.includes(peerId);
      } catch {}
    }

    let reconnectDelay = 1000;
    let shouldReconnect = true;
    window.addEventListener('beforeunload', () => { shouldReconnect = false; });

    function connect() {
      ws = new WebSocket(`${WS_URL}/ws/${roomId}?token=${token}`);

      ws.onopen = () => {
        reconnectDelay = 1000;
        statusEl.textContent = 'Forbundet';
        document.body.dataset.wsConnected = '';
        setTimeout(() => { if (statusEl.textContent === 'Forbundet') statusEl.textContent = ''; }, 2000);
      };

      ws.onmessage = e => {
        const data = JSON.parse(e.data);
        if (data.type === 'signal') {
          handleSignal(data.from, data.signal);
        } else {
          if (isDm && data.user === roomName) {
            if (data.type === 'join') {
              peerOnline = true;
              if (sharing) setTimeout(reinitiateOffer, 500);
            } else if (data.type === 'leave') {
              peerOnline = false;
            }
          }
          appendMessage(data);
        }
      };

      ws.onclose = () => {
        delete document.body.dataset.wsConnected;
        if (!shouldReconnect) return;
        const secs = Math.round(reconnectDelay / 1000);
        statusEl.textContent = `Forbindelsen mistet — forsøger igen om ${secs}s…`;
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 30000);
      };

      ws.onerror = () => ws.close();
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const content = input.value.trim();
      if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ content }));
      input.value = '';
    }

    document.getElementById('msgInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    (async () => {
      await addTurnServer();
      await checkPeerPresence();
      await loadHistory();
      connect();
    })();
  </script>
</body>
</html>
