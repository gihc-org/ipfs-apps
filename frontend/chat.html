<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { height: 100vh; overflow: hidden; }
    .chat-layout { display: flex; flex-direction: column; height: 100vh; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg { max-width: 680px; width: 100%; margin: 0 auto; }
    .msg .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
    .msg .meta .author { font-weight: 700; color: var(--accent); }
    .msg.own .meta .author { color: var(--text); }
    .msg .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg.own .bubble { background: var(--surface2); }
    .system-msg {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      max-width: 100%;
    }
    .input-bar input { flex: 1; }
    #status { font-size: 12px; color: var(--text-muted); padding: 4px 20px; background: var(--surface); }
  </style>
</head>
<body>
  <div class="chat-layout">
    <nav>
      <a href="rooms.html" class="brand" style="text-decoration:none">← Rum</a>
      <span id="roomTitle" style="font-weight:700"></span>
      <span class="user" id="navUser"></span>
    </nav>

    <div id="status">Forbinder...</div>
    <div class="messages" id="messages"></div>

    <div class="input-bar">
      <input type="text" id="msgInput" placeholder="Skriv en besked..." autocomplete="off">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const username = localStorage.getItem('username');
    if (!token) { location.href = 'index.html'; }

    const params = new URLSearchParams(location.search);
    const roomId = params.get('room_id');
    const roomName = decodeURIComponent(params.get('room_name') || 'Rum');
    if (!roomId) { location.href = 'rooms.html'; }

    document.getElementById('roomTitle').textContent = '# ' + roomName;
    document.getElementById('navUser').textContent = username || '';
    document.title = `#${roomName} — Chat`;

    const messagesEl = document.getElementById('messages');
    const statusEl = document.getElementById('status');
    let ws;

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendMessage({ type, user, content, created_at }) {
      if (type === 'join' || type === 'leave') {
        const div = document.createElement('div');
        div.className = 'system-msg';
        div.textContent = type === 'join' ? `${user} kom ind i rummet` : `${user} forlod rummet`;
        messagesEl.appendChild(div);
      } else if (type === 'message') {
        const div = document.createElement('div');
        div.className = 'msg' + (user === username ? ' own' : '');
        const time = created_at ? new Date(created_at).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' }) : '';
        div.innerHTML = `
          <div class="meta"><span class="author">${escapeHtml(user)}</span> ${escapeHtml(time)}</div>
          <div class="bubble">${escapeHtml(content)}</div>
        `;
        messagesEl.appendChild(div);
      }
      scrollBottom();
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadHistory() {
      try {
        const res = await fetch(`${API_URL}/rooms/${roomId}/messages`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) return;
        const msgs = await res.json();
        msgs.forEach(m => appendMessage({ type: 'message', user: m.user, content: m.content, created_at: m.created_at }));
      } catch (_) {}
    }

    function connect() {
      ws = new WebSocket(`${WS_URL}/ws/${roomId}?token=${token}`);

      ws.onopen = () => {
        statusEl.textContent = 'Forbundet';
        setTimeout(() => { statusEl.textContent = ''; }, 2000);
      };

      ws.onmessage = e => {
        const data = JSON.parse(e.data);
        appendMessage(data);
      };

      ws.onclose = () => {
        statusEl.textContent = 'Forbindelsen mistet — forsøger igen...';
        setTimeout(connect, 3000);
      };

      ws.onerror = () => ws.close();
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const content = input.value.trim();
      if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ content }));
      input.value = '';
    }

    document.getElementById('msgInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    (async () => {
      await loadHistory();
      connect();
    })();
  </script>
</body>
</html>
