# Lokal udvikling — bruges automatisk af `docker compose up`
# I produktion: docker compose -f docker-compose.yml up
#
# Caddy ligger i det delte platform-lag (se ~/projects/infra). Lokal frontend
# serveres af Playwright via python -m http.server 8888, eller direkte fra disk.
services:
  chat:
    ports:
      - "8001:8080"

  postgres:
    ports:
      - "5432:5432"
