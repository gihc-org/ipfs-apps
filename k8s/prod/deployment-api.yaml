apiVersion: apps/v1
kind: Deployment
metadata:
  name: loft-api
  namespace: loft-prod
spec:
  replicas: 1
  # Lofts/presence er in-memory — flere replicas er meningsløse.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loft-api
  template:
    metadata:
      labels:
        app: loft-api
    spec:
      containers:
        - name: loft-api
          # Prod deployes på SHA-tag (ikke latest), så rollback er
          # `kubectl set image` til det forrige tag. Bumpes ved hver promote.
          image: ghcr.io/gihc-org/loft:d0829054baf36b22316bebb599efcaa8c79deeeb
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: loft-secrets
                  key: database-url
            - name: ALLOWED_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: loft-config
                  key: allowed-origin
            - name: LOFT_TTL_HOURS
              valueFrom:
                configMapKeyRef:
                  name: loft-config
                  key: loft-ttl-hours
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
