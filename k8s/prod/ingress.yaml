apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loft
  namespace: loft-prod
  annotations:
    # Start staging → verificér cert → skift til letsencrypt-prod.
    cert-manager.io/cluster-issuer: letsencrypt-staging
    # WebSocket på /v1/ws/:loft_id er langlivet.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - loft.gihc.online
      secretName: loft-gihc-online-tls
  rules:
    - host: loft.gihc.online
      http:
        paths:
          # Liveness-endenpointet ligger i API'et, men skal kunne nås udefra
          # (smoke-test, uptime-check) — derfor en eksplicit rute før "/".
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: loft-api
                port:
                  number: 80
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: loft-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loft-web
                port:
                  number: 80
