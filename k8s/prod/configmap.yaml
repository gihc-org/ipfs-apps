apiVersion: v1
kind: ConfigMap
metadata:
  name: loft-config
  namespace: loft-prod
data:
  # Frontend-konfiguration pr. miljø — mountes på /usr/share/nginx/html/config.js.
  # TURN_SECRET er reelt offentlig (HMAC-baserede credentials, 24 t TTL) og
  # deles med coturn via nøglen turn-secret nedenfor — hold de to i sync.
  # Prod-secret. Værdien er reelt offentlig (den udleveres til browseren i
  # config.js), så den ligger her som i test — misbrug begrænses i stedet af
  # coturns `--denied-peer-ip` og kvoter. Hold `turn-secret` og TURN_SECRET i
  # config.js identiske.
  config.js: |
    const API_URL = 'https://loft.gihc.online';
    const WS_URL  = 'wss://loft.gihc.online';
    const TURN_URL = 'turn:loft.gihc.online:3478?transport=udp';
    const TURN_SECRET = 'edb66d3cca867737fd08bfdab6b2fbbce2e0770b7e620bea';
  turn-secret: "edb66d3cca867737fd08bfdab6b2fbbce2e0770b7e620bea"
  realm: "loft.gihc.online"
  external-ip: "65.109.233.92"
  allowed-origin: "https://loft.gihc.online"
  loft-ttl-hours: "168"
