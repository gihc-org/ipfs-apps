name: Build and push Loft images

on:
  push:
    branches: [trunk]
  # Testmiljøet deployer fra denne gren før M5-merge til trunk — derfor kan
  # workflowet også startes manuelt på en vilkårlig gren.
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rust-build er langsom — GHA-cache genbruges mellem runs.
      - uses: docker/build-push-action@v6
        with:
          context: ./chat
          file: ./chat/Dockerfile
          push: true
          tags: |
            ghcr.io/gihc-org/loft:${{ github.sha }}
            ghcr.io/gihc-org/loft:latest
          cache-from: type=gha,scope=loft-api
          cache-to: type=gha,mode=max,scope=loft-api

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/gihc-org/loft-web:${{ github.sha }}
            ghcr.io/gihc-org/loft-web:latest

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loftdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Build backend
        run: cargo build
        working-directory: chat

      - name: Install e2e deps
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          cd chat
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/loftdb \
            PORT=8080 nohup ./target/debug/chat > /tmp/loft-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz && exit 0
            sleep 1
          done
          echo "Backend startede ikke" >&2
          tail -50 /tmp/loft-api.log >&2
          exit 1

      - name: Run Playwright e2e
        working-directory: e2e
        env:
          # BASE_URL sættes bevidst IKKE: playwright.config.ts starter selv en
          # statisk server på :8888 når BASE_URL er tom (sættes BASE_URL, går
          # testene mod et allerede kørende miljø i stedet).
          TEST_API_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
