name: Build and push Loft images

on:
  push:
    branches: [trunk]

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rust-build er langsom — GHA-cache genbruges mellem runs.
      - uses: docker/build-push-action@v6
        with:
          context: ./chat
          file: ./chat/Dockerfile
          push: true
          tags: |
            ghcr.io/gihc-org/loft:${{ github.sha }}
            ghcr.io/gihc-org/loft:latest
          cache-from: type=gha,scope=loft-api
          cache-to: type=gha,mode=max,scope=loft-api

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/gihc-org/loft-web:${{ github.sha }}
            ghcr.io/gihc-org/loft-web:latest
