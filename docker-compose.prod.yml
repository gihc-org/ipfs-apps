# Produktionskonfiguration — bruges af Ansible:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  caddy:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49200:49152-49200/udp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--lt-cred-mech"
      - "--fingerprint"
      - "--no-multicast-peers"
      - "--no-cli"
      - "--realm=${DOMAIN}"
      - "--external-ip=${VPS_IP}"
      - "--user=${TURN_USERNAME}:${TURN_PASSWORD}"
      - "--min-port=49152"
      - "--max-port=49200"
