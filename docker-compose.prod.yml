# Produktionskonfiguration — bruges af Ansible:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  caddy:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

  chat-beta:
    build: ./chat
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-chatuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chatdb}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGIN: ${BETA_ALLOWED_ORIGIN}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-noreply@example.com}
      BASE_URL: ${BETA_BASE_URL}
      FRONTEND_URL: ${BETA_FRONTEND_URL}
    depends_on:
      postgres:
        condition: service_healthy

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49200:49152-49200/udp"
    command:
      - "-n"
      - "--log-file=stdout"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--fingerprint"
      - "--no-multicast-peers"
      - "--no-cli"
      - "--realm=${DOMAIN}"
      - "--external-ip=${VPS_IP}"
      - "--min-port=49152"
      - "--max-port=49200"
